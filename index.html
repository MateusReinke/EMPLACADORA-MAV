<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>%SEO_TITLE%</title>
    <meta name="description" content="%SEO_DESCRIPTION%" />
    <link rel="canonical" href="%SITE_URL%/" />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <meta name="author" content="MAV Emplacamento" />
    <meta name="theme-color" content="#0A1F44" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#091428" media="(prefers-color-scheme: dark)" />

    <!-- SEO local: reforça região de atendimento -->
    <meta name="geo.region" content="BR-SP" />
    <meta name="geo.placename" content="Chácara Santo Antônio, São Paulo" />

    <!-- Open Graph (WhatsApp, Facebook, Instagram) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="MAV Emplacamento" />
    <meta property="og:locale" content="pt_BR" />
    <meta property="og:url" content="%SITE_URL%/" />
    <meta property="og:title" content="%SEO_OG_TITLE%" />
    <meta property="og:description" content="%SEO_OG_DESCRIPTION%" />
    <meta property="og:image" content="%SITE_URL%%SEO_OG_IMAGE%" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:alt" content="%SEO_OG_IMAGE_ALT%" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="%SEO_OG_TITLE%" />
    <meta name="twitter:description" content="%SEO_OG_DESCRIPTION%" />
    <meta name="twitter:image" content="%SITE_URL%%SEO_OG_IMAGE%" />

    <link rel="icon" type="image/svg+xml" href="/mav-emplacamento-logo.svg" />
    <link rel="apple-touch-icon" href="/mav-emplacamento-logo.svg" />

    <!-- Tipografia da marca: títulos pesados (Archivo) e texto legível (Inter) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=Inter:wght@400;500;600&display=swap"
    />

    <script>
      /*
       * Liga as animações de entrada apenas quando há JavaScript e o usuário
       * não pediu menos movimento. Sem este atributo o CSS não esconde nada, e
       * o HTML pré-renderizado aparece completo antes do bundle carregar.
       */
      (function () {
        try {
          if (!window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
            document.documentElement.dataset.anim = "on";
          }
        } catch (e) {
          /* sem matchMedia: segue sem animação, conteúdo visível */
        }

        /*
         * Tema do site público, resolvido antes da primeira pintura: escolha
         * salva > preferência do sistema > claro. Feito aqui, e não no React,
         * porque decidir depois da montagem faria a página piscar branca antes
         * de virar escura.
         */
        try {
          var saved = null;
          try {
            saved = localStorage.getItem("mav-site-theme");
          } catch (e) {
            /* modo privativo: cai na preferência do sistema */
          }

          var dark =
            saved === "dark" ||
            (saved !== "light" &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);

          document.documentElement.dataset.siteTheme = dark ? "dark" : "light";
        } catch (e) {
          document.documentElement.dataset.siteTheme = "light";
        }
      })();
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
