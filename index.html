    <!-- Tipografia da marca: títulos pesados (Archivo) e texto legível (Inter) -->

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=Inter:wght@400;500;600&display=swap"
    />

    <script>
      /*
       * Liga as animações de entrada apenas quando há JavaScript e o usuário
       * não pediu menos movimento. Sem este atributo o CSS não esconde nada, e
       * o HTML pré-renderizado aparece completo antes do bundle carregar.
       */
      (function () {
        try {
          if (!window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
            document.documentElement.dataset.anim = "on";
          }
        } catch (e) {
          /* sem matchMedia: segue sem animação, conteúdo visível */
        }
      })();
    </script>
  </head>

  <body>

  </body>
